schema_version: 1

context:
  name: pyslice
  version: "6.0.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 42765460d5a98f7a17ae3f569caf9a79a2829fd3a0528ad12fe28b0c1a3c4a24

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - pyslice = pyslice:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - binaryornot
    - chardet
    - numpy

tests:
  - python:
      imports:
        - pyslice
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pyslice --help

about:
  summary: Specialized templating engine do develop a parameterized set of model data sets
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/pyslice/

extra:
  recipe-maintainers:
    - timcera
